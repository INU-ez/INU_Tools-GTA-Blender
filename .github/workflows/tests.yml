name: tests

on:
  push:
  pull_request:

jobs:
  # Lane 1: pure-Python tests + static guards.
  # Runs without Blender. Catches the cheap stuff fast: parser/writer
  # unit tests, manifest validity, eval/exec ban, subprocess audit.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      # Skip packaging (needs Blender) and e2e (needs Blender + assets).
      - name: Run core + compliance tests
        run: pytest -q dev/tests/ --ignore=dev/tests/test_packaging.py --ignore=dev/tests/e2e

  # Lane 2: build the extension zip on a real Blender and validate it.
  # The same single zip serves both the GitHub release and
  # extensions.blender.org (no store/full split).
  build-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.20-linux-x64

      - name: Download Blender 4.2 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/blender
          url="https://download.blender.org/release/Blender4.2/blender-4.2.20-linux-x64.tar.xz"
          curl -fsSL "$url" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C ~/blender --strip-components=1

      - name: Build extension zip
        run: |
          set -e
          "$HOME/blender/blender" --command extension build \
            --source-dir INU_tools \
            --output-dir .
          ls -la inu_tools_gta_sa-*.zip

      - name: Validate zip
        run: |
          export BLENDER="$HOME/blender/blender"
          zip=$(ls inu_tools_gta_sa-*.zip | head -n 1)
          "$BLENDER" --command extension validate "$zip"

      - name: Test packaged extension enable and disable
        run: |
          set -e
          export BLENDER_USER_CONFIG="$RUNNER_TEMP/inu-blender-enable-test"
          export BLENDER_USER_EXTENSIONS="$RUNNER_TEMP/inu-blender-enable-extensions"
          mkdir -p "$BLENDER_USER_CONFIG" "$BLENDER_USER_EXTENSIONS"
          zip=$(ls inu_tools_gta_sa-*.zip | head -n 1)
          "$HOME/blender/blender" --background --factory-startup --disable-autoexec \
            --python-exit-code 1 --python dev/tests/_extension_enable_entry.py -- "$zip"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: inu-tools
          path: inu_tools_gta_sa-*.zip
          if-no-files-found: error
          retention-days: 30
